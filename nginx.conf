server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
  location / { try_files $uri $uri/ /index.html; }
  add_header Cache-Control "no-cache" always;
}
